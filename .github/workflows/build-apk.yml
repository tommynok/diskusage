name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses & Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/custom.jks
          fi

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/custom.jks ]; then
            echo "custom.jks size: $(wc -c < app/custom.jks) bytes"
            STORE_PASS=$(echo -n "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_PASS=$(echo -n "$KEY_PASSWORD" | tr -d '\r\n')
            [ -z "$KEY_PASS" ] && KEY_PASS="$STORE_PASS"
            ALIAS=$(echo -n "$KEY_ALIAS" | tr -d '\r\n')

            echo "=== Checking Keystore Store Password ==="
            if keytool -list -keystore app/custom.jks -storepass "$STORE_PASS" > /dev/null 2>&1; then
              echo "Keystore store password is valid."
            else
              echo "::error::KEYSTORE_PASSWORD is incorrect or keystore corrupted!"
            fi

            echo "=== Checking Key Alias and Password ==="
            if keytool -certreq -keystore app/custom.jks -alias "$ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" > /dev/null 2>&1; then
              echo "Key alias and key password are valid."
            else
              echo "::error::Cannot recover key for alias '$ALIAS' with current password! Check KEY_ALIAS / KEYSTORE_PASSWORD or add KEY_PASSWORD secret if key password differs."
            fi
          fi

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: diskusage-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diskusage-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
