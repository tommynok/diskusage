name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses & Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"

      - name: Build Native Executables into jniLibs
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/25.2.9519653"
          "$NDK_DIR/ndk-build" -C app/src/main/jni NDK_PROJECT_PATH=null NDK_APPLICATION_MK=Application.mk APP_BUILD_SCRIPT=Android.mk NDK_OUT=../build/ndk-out NDK_LIBS_OUT=../build/ndk-libs
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "app/build/ndk-libs/$abi/scan" ]; then
              cp "app/build/ndk-libs/$abi/scan" "app/src/main/jniLibs/$abi/libscan.so"
              chmod 755 "app/src/main/jniLibs/$abi/libscan.so"
              echo "Built executable for $abi: $(file app/src/main/jniLibs/$abi/libscan.so)"
            else
              echo "Error: app/build/ndk-libs/$abi/scan not found!"
              exit 1
            fi
          done

      - name: Decode Custom Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/custom.jks
          fi

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/custom.jks ]; then
            echo "custom.jks size: $(wc -c < app/custom.jks) bytes"
            STORE_PASS=$(echo -n "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_PASS=$(echo -n "$KEY_PASSWORD" | tr -d '\r\n')
            [ -z "$KEY_PASS" ] && KEY_PASS="$STORE_PASS"
            ALIAS=$(echo -n "$KEY_ALIAS" | tr -d '\r\n')

            echo "=== Checking Keystore Store Password ==="
            if ! keytool -list -keystore app/custom.jks -storepass "$STORE_PASS" ; then
              echo "::warning::KEYSTORE_PASSWORD does not match custom.jks! Falling back to diskusage.jks for this build."
              rm -f app/custom.jks
            elif ! keytool -certreq -keystore app/custom.jks -alias "$ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" ; then
              echo "::warning::Cannot recover key for alias '$ALIAS'! Check KEY_ALIAS / KEYSTORE_PASSWORD or add KEY_PASSWORD secret. Falling back to diskusage.jks."
              rm -f app/custom.jks
            else
              echo "Keystore and credentials verified successfully!"
            fi
          fi

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Inspect libscan.so in Release APK
        run: |
          echo "=== Scanning APK for native binaries ==="
          unzip -l app/build/outputs/apk/release/*.apk | grep libscan || true
          mkdir -p /tmp/apk_inspect
          unzip -p app/build/outputs/apk/release/*.apk lib/arm64-v8a/libscan.so > /tmp/apk_inspect/libscan.so || true
          if [ -s /tmp/apk_inspect/libscan.so ]; then
            file /tmp/apk_inspect/libscan.so || true
            readelf -h /tmp/apk_inspect/libscan.so | grep -E "Type:|Entry point" || true
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: diskusage-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diskusage-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
