apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
android {
    namespace 'com.google.android.diskusage'
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.google.android.diskusage"
        targetSdk 33
        minSdk 21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
    jvmTarget = "1.8"
    }
    sourceSets {
        main {
            java {
                srcDir 'src/main/java'
            }
        }
    }

    signingConfigs {
        common {
            def customKeystore = file('custom.jks')
            if (customKeystore.exists()) {
                def envStorePass = System.getenv("KEYSTORE_PASSWORD")?.trim()
                def envAlias = System.getenv("KEY_ALIAS")?.trim()
                def envKeyPass = System.getenv("KEY_PASSWORD")?.trim()

                def storePass = (envStorePass && !envStorePass.isEmpty()) ? envStorePass : "diskusage"
                def alias = (envAlias && !envAlias.isEmpty()) ? envAlias : "diskusage"
                def keyPass = storePass

                if (envKeyPass && !envKeyPass.isEmpty()) {
                    try {
                        def ks = java.security.KeyStore.getInstance(customKeystore, storePass.toCharArray())
                        def key = ks.getKey(alias, envKeyPass.toCharArray())
                        if (key != null) {
                            keyPass = envKeyPass
                        }
                    } catch (Exception ignored) {
                        keyPass = storePass
                    }
                }

                storeFile customKeystore
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            } else {
                storeFile file('diskusage.jks')
                storePassword 'diskusage'
                keyAlias 'diskusage'
                keyPassword 'diskusage'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.common
        }
        release {
            signingConfig signingConfigs.common
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "diskusage-v${variant.versionName}-${variant.name}.apk"
    }
}

dependencies {
    // implementation files('src/main/extra/system.jar')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'me.zhanghai.android.appiconloader:appiconloader:1.5.0'
    implementation "com.louiscad.splitties:splitties-toast:$splitties_version"
    implementation "com.louiscad.splitties:splitties-resources:$splitties_version"

    testImplementation 'junit:junit:4.13.2'
}
